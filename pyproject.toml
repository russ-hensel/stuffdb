[project]
name = "StuffDB"
version = "0.1.0"
description = "A database in Python and QT to keep track of all kinds of stuff"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "unidecode>=1.3.0",
    "wat-inspector",
    "qtpy",
    "gmplot",
    "exifread",
    "pyqt6>=6.11.0",
    "pyqt6-webengine>=6.11.0",
]

[tool.pylint.typecheck]
ignored-modules = ["qtpy", "qtpy.QtCore", "qtpy.QtGui", "qtpy.QtWidgets"]
